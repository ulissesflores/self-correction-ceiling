name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No bytecode caches inside the tree: they would carry the runner's absolute paths.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    # Verification first: (1) the committed seal must recompute from the files on disk; (2) the
    # full replication regenerates results.json and the figures into output/replicated/ (never a
    # sealed path), compares results.json byte for byte, runs the whole test suite and verifies the
    # seal again. A rendered image that differs only warns: it depends on the font rasteriser.
    name: seal + replication + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # requirements.txt, not "pip install .": the package is a set of scripts, not a library.
        run: python -m pip install -r requirements.txt
      - name: Verify the committed provenance seal
        run: python make_provenance.py --verify
      - name: Replication (outputs -> byte comparison -> tests -> seal verification)
        run: python run_all.py

  lint:
    name: ruff + docstring coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        # Pinned: the formatter output changes between ruff releases.
        run: python -m pip install "ruff==0.17.4" "interrogate==1.7.0"
      - run: ruff format --no-cache --check .
      - run: ruff check --no-cache .
      - run: interrogate -c pyproject.toml code scripts tests run_all.py make_provenance.py
